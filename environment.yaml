name: aenpi

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # ── Scientific stack ───────────────────────────────────────────────────────
  - numpy>=1.24
  - scipy>=1.11

  # ── NLP essentials ─────────────────────────────────────────────────────────
  - pip:
      # library itself (editable install so changes are reflected immediately)
      - -e .[dev]

      # Urdu / Arabic text handling
      - regex>=2023.10
      - arabic-reshaper>=3.0
      - python-bidi>=0.4.2

      # lightweight ML (for sentiment, NER, intent router)
      - scikit-learn>=1.4
      - joblib>=1.3

      # notebook support
      - jupyter>=1.0
      - ipykernel>=6.0

      # ── Dev / test ────────────────────────────────────────────────────────
      - pytest>=8.0
      - pytest-cov>=5.0
      - black>=24.4
      - isort>=5.13
      - flake8>=7.1
      - flake8-bugbear
      - flake8-comprehensions
      - pre-commit>=3.7
      - build
      - twine
